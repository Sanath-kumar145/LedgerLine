# ==============================================================================
# LedgerLine — Integration Test Configuration
# ==============================================================================
# Real MySQL 8.0 engine instantiated dynamically via Testcontainers JDBC driver.
# Flyway migrations run automatically on startup to validate real DDL and seeds.
# Zero H2 in-memory substitution — strict MySQL compatibility.
# ==============================================================================

# Testcontainers MySQL 8.0 DataSource
spring.datasource.url=jdbc:tc:mysql:8.0.36:///ledgerline_test?TC_REUSABLE=true
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Security JWT Test Properties
jwt.secret=9a3f2c4e5b6a7d8e9f0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e
jwt.expiration-ms=86400000
