# ==============================================================================
# LedgerLine — Test Configuration
# ==============================================================================
# IMPORTANT ARCHITECTURAL NOTICE (DAY 1 BOOTSTRAP STUB):
# The following auto-configuration exclusion is strictly a Day 1 bootstrap stub.
# On Day 1, zero JPA entities, repositories, or Flyway migrations exist in the
# codebase, and no database container is yet wired. Excluding these auto-configurations
# allows the baseline Spring Context test (contextLoads()) to verify the framework
# boot sequence without failing on missing DataSource credentials.
#
# DO NOT RETAIN THIS EXCLUSION FOR INTEGRATION TESTING ON DAY 2+:
# In Day 2 and Day 3, real persistence, migrations, and pessimistic locking will be
# tested. The official integration testing strategy requires a real MySQL engine via
# Testcontainers (org.testcontainers:mysql) or an active MySQL test database:
#
#   spring.datasource.url=jdbc:tc:mysql:8.0.36:///ledgerline_test
#   spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver
#   spring.jpa.hibernate.ddl-auto=validate
#   spring.flyway.enabled=true
# ==============================================================================

spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,\
  org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration,\
  org.springframework.boot.data.jpa.autoconfigure.JpaRepositoriesAutoConfiguration,\
  org.springframework.boot.orm.jpa.autoconfigure.HibernateJpaAutoConfiguration
