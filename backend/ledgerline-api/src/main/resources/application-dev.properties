# ==============================================================================
# LedgerLine API — Local Development Profile Configuration
# Activate via: --spring.profiles.active=dev or SPRING_PROFILES_ACTIVE=dev
# ==============================================================================
# For local developer workstations where TLS certificates are not configured on local MySQL.
# Do NOT activate this profile in production environments.
# ==============================================================================
spring.datasource.url=${DEV_DB_URL:${DB_URL:jdbc:mysql://localhost:3306/${DB_NAME:ledgerline}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}}
spring.datasource.username=${DEV_DB_USERNAME:${DB_USERNAME:root}}
spring.datasource.password=${DEV_DB_PASSWORD:${DB_PASSWORD:}}

# Development JWT secret (for local offline testing only)
jwt.secret=${DEV_JWT_SECRET:${JWT_SECRET:LocalDevSecretKeyMustBeAtLeast256BitsLongForHMACSHA256SecureSigning!}}
jwt.expiration-ms=86400000

