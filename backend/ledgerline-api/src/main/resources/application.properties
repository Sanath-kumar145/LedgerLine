# ==============================================================================
# LedgerLine API — Production Application Configuration
# ==============================================================================
spring.application.name=ledgerline-api

# MySQL Datasource (Externalized; MUST be supplied via environment variables)
# Production database connections MUST enforce TLS encryption (sslMode=REQUIRED).
# Insecure parameters (useSSL=false, allowPublicKeyRetrieval=true) are prohibited in production.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ledgerline?sslMode=REQUIRED&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

# Flyway Database Migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT Security Configuration (Externalized; MUST be supplied via environment variable JWT_SECRET)
# Secret must contain at least 32 bytes (256 bits) of entropy.
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
